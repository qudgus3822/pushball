# [신설: 2026-11-10 12:21, 김병현 작성] 홈서버 k3s 배포용 워크플로.
#   이미지 빌드 -> GHCR 푸시(태그 sha-<7자리>) -> k8s-config repo 의 이미지 태그 갱신(ArgoCD 가 끌어가서 배포).
#   필요한 시크릿: K8S_CONFIG_DEPLOY_KEY (k8s-config repo 에 "쓰기 허용"으로 등록한 deploy key 의 개인키)
# [변경: 2026-11-10 13:18, 김병현 수정] Supabase 를 걷어내면서 repo 변수(VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)와 build-args 를 지웠다.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pushball
  cancel-in-progress: false

# 기본 권한은 읽기만. 필요한 job 에서만 따로 올린다.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/qudgus3822/pushball

jobs:
  build:
    # 기본 브랜치가 아닌 브랜치에서 수동 실행(workflow_dispatch)해도 배포되지 않게 막는다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 이미지 태그 계산
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # k8s-config 에는 deploy key(ssh)로 쓰므로 GITHUB_TOKEN 권한은 필요 없다.
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: qudgus3822/k8s-config
          ssh-key: ${{ secrets.K8S_CONFIG_DEPLOY_KEY }}

      # 러너 기본 yq 버전에 의존하지 않도록 버전을 고정하고, 릴리스의 checksums(SHA-256)로 검증한 뒤 설치한다.
      - name: yq 설치
        run: |
          base=https://github.com/mikefarah/yq/releases/download/v4.54.2
          cd "$(mktemp -d)"
          wget -q "$base/yq_linux_amd64" "$base/checksums" "$base/checksums_hashes_order"
          col=$(( $(grep -nx 'SHA-256' checksums_hashes_order | cut -d: -f1) + 1 ))
          expected=$(awk -v c="$col" '$1 == "yq_linux_amd64" { print $c }' checksums)
          [ -n "$expected" ] || { echo "::error::yq checksum 못 찾음"; exit 1; }
          echo "$expected  yq_linux_amd64" | sha256sum -c -
          sudo install -m 0755 yq_linux_amd64 /usr/local/bin/yq

      - name: 이미지 태그 갱신·커밋·푸시
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ needs.build.outputs.tag }}
          FILE: apps/pushball/kustomization.yaml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이미지 이름이 kustomization 에 없으면 아무것도 안 바뀐 채 초록불로 끝나므로 먼저 확인해서 실패시킨다.
          yq -e '.images[] | select(.name == strenv(IMAGE))' "$FILE" >/dev/null \
            || { echo "::error::$FILE 의 images 에 항목 없음: $IMAGE"; exit 1; }
          for attempt in 1 2 3; do
            yq -e '.images[] | select(.name == strenv(IMAGE))' "$FILE" >/dev/null
            yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' "$FILE"
            git add "$FILE"
            if git diff --cached --quiet; then echo "변경 없음: 이미 $TAG"; exit 0; fi
            git commit -m "deploy(pushball): $TAG"
            if git push; then exit 0; fi
            echo "푸시 충돌 — 재시도 $attempt/3"
            # 내 커밋을 버리고 원격 최신으로 맞춘 뒤 태그를 다시 갱신한다. fetch 실패는 set -e 로 즉시 실패 처리된다.
            git fetch origin
            git reset --hard "@{u}"
          done
          echo "::error::3회 재시도 후에도 푸시 실패"
          exit 1
