# [신설: 2026-11-10 12:21, 김병현 작성] 정적 게임 서빙 설정 신규 작성 (nginx-unprivileged, 8080).
server {
    listen 8080;
    server_name _;
    # 응답 헤더/에러 페이지에 nginx 버전을 노출하지 않는다.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 정적 파일은 장기 캐시(내용이 바뀌면 파일명이 바뀐다)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 항상 최신본을 받게 한다(새 배포 즉시 반영)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
